# An `electrum_client::ElectrumApi` that sends each Electrum call as an MCP
# `tools/call` over Nostr to a `contextbtc-electrs-server`. `bdk_electrum`'s
# `BdkElectrumClient` is generic over `ElectrumApi`, so it syncs through this
# without any `[patch.crates-io]`.
[package]
name = "contextbtc-electrum-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# Only the `ElectrumApi` trait and its types are used. The default features
# add TLS and SOCKS support for its own TCP client, which we don't need.
electrum-client = { version = "0.25", default-features = false }

contextvm-sdk.workspace = true
futures.workspace = true
log = "0.4"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
