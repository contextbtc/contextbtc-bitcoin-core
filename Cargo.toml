[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/server",
    "crates/electrs-server",
    "crates/electrum-client-nostr",
    "crates/electrum-client-cli",
    "crates/client",
    "crates/e2e",
]

# `crates/bitcoincore-rpc-client` is a drop-in replacement for the crates.io
# `bitcoincore-rpc`: same API, but each call travels as an MCP `tools/call` over
# Nostr instead of HTTP JSON-RPC. Patching it in means unmodified crates.io
# crates that build on `bitcoincore-rpc` — notably `bdk_bitcoind_rpc` — sync
# against a contextbtc server without knowing it.
[patch.crates-io]
bitcoincore-rpc = { path = "crates/bitcoincore-rpc-client" }
bitcoincore-rpc-json = { path = "crates/bitcoincore-rpc-json" }

[workspace.package]
version = "0.1.0"
edition = "2024"
# Applies to the workspace members only. The vendored `bitcoincore-rpc*` crates
# under `crates/` are not members and stay under their upstream CC0-1.0.
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.103"
contextvm-sdk = { version = "0.2.0", features = ["rmcp"] }
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
dotenvy = "0.15.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
reqwest = { version = "0.12", features = ["json"] }
backon = "1.6.0"
futures = "0.3"
clap = { version = "4.5", features = ["derive", "env"] }
